name: Build SRA Windows App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop & Get Packages
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Release Folder
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath SRA-Windows-x64.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRA-Windows-App
          path: SRA-Windows-x64.zip
